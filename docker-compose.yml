services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - hippie_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # This is the only service that migrates. worker/mcp keep it at "0" so
      # three containers don't race `migrate` on start — MariaDB has no
      # transactional DDL, so a concurrent run can partially apply.
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - static_volume:/code/hippie_django/staticfiles
      - media_volume:/code/hippie_django/media
      - ./hippie_django/data:/code/hippie_django/data
      - ./hippie_django/logs:/code/hippie_django/logs
    networks:
      - hippie_net
    # Reach the MariaDB running on the Docker host (DB_HOST=host.docker.internal).
    # 172.18.0.1 = hippie_net gateway (host side of this bridge — same subnet as containers).
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /status/ is deeper than liveness: it checks the DB connection, the cache,
      # and that no migration is still pending. Everything else in this file waits
      # on this signal, which is what keeps "migrations finished" ahead of "traffic
      # served". urlopen() raises on a non-2xx, so the view's 503 fails the check.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # Longer than mcp's: this container runs migrate + collectstatic first.
      start_period: 30s

  worker:
    build:
      context: .
      # Not docker/web/Dockerfile: the worker additionally carries Nextflow, a
      # JRE and the pipeline's solver toolchain, none of which web or mcp can
      # execute. See the header of that file.
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Worker should not race the web container on migrate/collectstatic.
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      # Read by conf/hippie.config. The path is the in-container mount point
      # below, never a host path — Nextflow stages this file into each task's
      # work dir, so it must resolve inside the container.
      GRB_LICENSE_FILE: /etc/gurobi/gurobi.lic
      # Where run_split_job puts per-job Nextflow work dirs and outdirs.
      # Deliberately NOT under MEDIA_ROOT: Apache serves /vol/media/ directly,
      # and a work dir contains the staged copy of the WLS licence.
      NF_RUN_ROOT: /var/nf
      # Mount point of the pipeline checkout, mirrored so the task can stamp
      # `git rev-parse HEAD` into job.summary["pipeline_commit"].
      PIPELINE_DIR: /opt/pipeline
    volumes:
      - media_volume:/code/hippie_django/media
      # Nextflow scratch. A named volume rather than a bind so nothing under it
      # is reachable from any Apache Alias, and so a failed run's .command.err
      # survives a container restart.
      - nf_work:/var/nf
      # The ppi-splitting-pipeline checkout. Read-only: the pipeline's bin/ and
      # main.nf are inputs to the run, and the run must not be able to edit the
      # thing whose commit hash it records. PIPELINE_PATH overrides the source
      # for local development (e.g. a working tree outside this repo).
      - ${PIPELINE_PATH:-./pipeline}:/opt/pipeline:ro
      # The five precomputed artifacts live in hippie_django/data/precomputed/,
      # already inside this bind. web mounts the same directory read-write for
      # the import commands; the worker only ever reads it.
      - ./hippie_django/data:/code/hippie_django/data:ro
      # WLS credentials, mounted from outside the image. Never COPYed into a
      # layer — anything that has ever been in a layer is recoverable from it.
      - ${GUROBI_LICENSE_PATH:-./secrets/gurobi.lic}:/etc/gurobi/gurobi.lic:ro
    networks:
      - hippie_net
    # Reach the MariaDB running on the Docker host (DB_HOST=host.docker.internal).
    # 172.18.0.1 = hippie_net gateway (host side of this bridge — same subnet as containers).
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    depends_on:
      redis:
        condition: service_healthy
      web:
        # Not service_started: the worker must not touch the DB until web has
        # finished migrating it.
        condition: service_healthy

  mcp:
    # Same image as web — it needs the same Django app and settings — but served
    # by uvicorn instead of gunicorn, because the MCP streamable-HTTP transport
    # is ASGI and gunicorn here is running WSGI.
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Neither applies to this service: the web container owns migrations and
      # static files.
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command:
      - uvicorn
      - hippie_mcp.asgi:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    networks:
      - hippie_net
    # Reach the MariaDB running on the Docker host (DB_HOST=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    depends_on:
      redis:
        condition: service_healthy
      web:
        # Shares the database with web, so it waits for web's migrations too.
        condition: service_healthy
    healthcheck:
      # /health deliberately does not touch the database — it answers "is this
      # process up", which is what the proxy needs to know.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  apache:
    build:
      context: ./docker/apache
    restart: unless-stopped
    environment:
      APACHE_PUBLISHED_PATH: ${APACHE_PUBLISHED_PATH}
    volumes:
      - static_volume:/vol/static:ro
      - media_volume:/vol/media:ro
      # Release files served directly by Apache at /downloads/ (see hippie.conf.template).
      - ./hippie_django/data/user_downloads:/vol/downloads:ro
    ports:
      - "${HOST_PORT:-8080}:80"
    networks:
      - hippie_net
    depends_on:
      # Both healthy, not merely started — otherwise Apache starts proxying to a
      # backend that is still migrating and answers 502.
      web:
        condition: service_healthy
      mcp:
        condition: service_healthy

networks:
  hippie_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1

volumes:
  static_volume:
  media_volume:
  # Nextflow work dirs + outdirs, worker-only. Kept out of media_volume because
  # Apache serves that one directly and a Nextflow work dir holds a staged copy
  # of the Gurobi WLS licence. Work dirs are deleted on success and on cancel,
  # kept on failure so .command.err and .nextflow.log are still readable.
  nf_work:
